<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aquastainable</title>
<link rel="icon" href="/favicon.ico">
<script>
  // On a phone, open the app full screen instead of a phone inside a phone.
  if (window.matchMedia('(max-width: 600px)').matches) location.replace('/app.html');
</script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(900px 600px at 15% 10%, rgba(46, 140, 166, 0.35), transparent 60%),
      radial-gradient(800px 600px at 90% 90%, rgba(224, 120, 42, 0.18), transparent 60%),
      linear-gradient(160deg, #0F2A33 0%, #0B0D11 55%, #08090C 100%);
  }
  .phone-wrap { width: calc(418px * var(--s)); height: calc(872px * var(--s)); position: relative; }
  .phone {
    position: absolute; top: 0; left: 0; width: 418px; height: 872px;
    transform: scale(var(--s)); transform-origin: top left;
    border-radius: 62px; padding: 14px;
    background: linear-gradient(145deg, #2A2F38, #0E1014);
    box-shadow: 0 0 0 2px #3A404B inset, 0 40px 90px rgba(0, 0, 0, 0.6), 0 0 140px rgba(46, 140, 166, 0.18);
  }
  .screen { width: 390px; height: 844px; border-radius: 48px; overflow: hidden; background: #0B0D11; position: relative; }
  /* Status bar and home bar float over the app, like on a real phone. */
  .status { position: absolute; top: 0; left: 0; right: 0; z-index: 3; pointer-events: none; text-shadow: 0 1px 2px rgba(0,0,0,0.35); height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 6px 34px 0 40px; font: 600 15px/1 -apple-system, system-ui, sans-serif; color: #fff; }
  .status .icons { display: flex; gap: 6px; align-items: center; }
  .status .bars { display: flex; gap: 2px; align-items: flex-end; }
  .status .bars i { width: 3px; background: #fff; border-radius: 1px; display: block; }
  .status .batt { width: 25px; height: 12px; border: 1.5px solid rgba(255, 255, 255, 0.6); border-radius: 4px; padding: 1.5px; }
  .status .batt i { display: block; height: 100%; width: 78%; background: #fff; border-radius: 1.5px; }
  .island { position: absolute; top: 25px; left: 50%; transform: translateX(-50%); width: 120px; height: 34px; border-radius: 20px; background: #000; z-index: 2; pointer-events: none; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  .home-ind { position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; pointer-events: none; height: 30px; display: grid; place-items: center; }
  .home-ind i { width: 134px; height: 5px; border-radius: 3px; background: rgba(255, 255, 255, 0.7); display: block; }
</style>
</head>
<body>
  <div class="phone-wrap">
    <div class="phone">
      <div class="island"></div>
      <div class="screen">
        <div class="status">
          <span id="clock">9:41</span>
          <span class="icons">
            <span class="bars"><i style="height:4px"></i><i style="height:6px"></i><i style="height:8px"></i><i style="height:10px"></i></span>
            <span class="batt"><i></i></span>
          </span>
        </div>
        <iframe title="Aquastainable" src="/app.html"></iframe>
        <div class="home-ind"><i></i></div>
      </div>
    </div>
  </div>
<script>
  // Scale the phone to fit the window (computer and tablet).
  function fit() {
    var s = Math.min(1, (window.innerHeight - 40) / 872, (window.innerWidth - 40) / 418);
    document.documentElement.style.setProperty('--s', Math.max(0.4, s).toFixed(3));
  }
  fit();
  window.addEventListener('resize', fit);
  (function tick() {
    var d = new Date();
    document.getElementById('clock').textContent = d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0');
    setTimeout(tick, 30000);
  })();
</script>
</body>
</html>
